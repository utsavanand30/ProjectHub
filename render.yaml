services:
  # ── FastAPI Backend ──────────────────────────────────────────────────────────
  - type: web
    name: projecthub-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.render
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: projecthub-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 30
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      - key: ENVIRONMENT
        value: production
      - key: SETUP_SECRET_TOKEN
        generateValue: true
      - key: SEED_ADMIN_EMAIL
        value: admin@projecthub.dev
      - key: SEED_ADMIN_PASSWORD
        value: Admin@123456
      - key: SEED_ADMIN_NAME
        value: System Admin
      - key: BACKEND_CORS_ORIGINS
        value: https://projecthub-frontend-6eer.onrender.com

  # ── React Frontend ───────────────────────────────────────────────────────────
  - type: web
    name: projecthub-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npx serve -s dist -l $PORT
    envVars:
      - key: VITE_API_URL
        value: https://projecthub-backend-pbrc.onrender.com/api/v1
      - key: NODE_VERSION
        value: 20

# ── PostgreSQL Database ──────────────────────────────────────────────────────
databases:
  - name: projecthub-db
    plan: free
    databaseName: projecthub
    user: projecthub
